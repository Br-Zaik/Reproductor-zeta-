name: Descomprimir y Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir ReproductorPro.zip
        run: |
          unzip -o ReproductorPro.zip -d proyecto_app

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK Debug
        working-directory: ./proyecto_app
        run: gradle assembleDebug --no-daemon

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ReproductorPro-APK
          path: proyecto_app/app/build/outputs/apk/debug/app-debug.apk
